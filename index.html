<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Forever 💜</title>
<style>
:root {
    --purple-bg: #f3e5f5;
    --main-purple: #9c27b0;
    --accent-pink: #ff4081;
    --accent-light: #ffc1e3;
}
body {
    background: linear-gradient(135deg, #f3e5f5, #ffc1e3);
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    transition: background 3s;
}
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(243, 229, 245, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 10px;
}
#overlay img { width: 120px; margin-bottom: 20px; max-width: 40vw; }
.start-btn {
    background: var(--main-purple);
    color: white;
    padding: 12px 25px;
    font-size: 1.1rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    animation: bounce 2s infinite;
    width: 80%;
    max-width: 300px;
}
@keyframes bounce { 0%, 100% {transform: scale(1);} 50% {transform: scale(1.1);} }
.container {
    background: rgba(255,255,255,0.98);
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 480px;
    width: 90%;
    position: relative;
    z-index: 10;
}
#counter-box {
    background: #fdf0ff;
    border: 2px dashed var(--main-purple);
    border-radius: 15px;
    padding: 15px;
    margin: 15px 0;
    font-size: 0.85rem;
}
.timer-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 5px;
    font-weight: bold;
    color: var(--main-purple);
}
.unit { font-size: 0.65rem; color: #666; text-transform: uppercase; }
.memory-list { text-align: left; margin: 15px 0; font-size: 0.85rem; }
.memory-point { border-left: 3px solid var(--accent-pink); padding-left: 10px; margin-bottom: 10px; }
.m-date { font-weight: bold; font-size: 0.7rem; color: var(--main-purple); }
.bubu-dudu { width: 100px; margin: 10px 0; }

button {
    padding: 10px 20px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}
#yesBtn { background: var(--accent-pink); color: white; font-size: 1rem; }
#noBtn { background: #eee; position: absolute; cursor: pointer; }
.hidden { display: none; }

.heart {
    position: fixed;
    font-size: 18px;
    z-index: 100;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    transition: transform 0.3s;
}
#ui {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
}
.love_word {
    color: #ea80b0;
    font-size: 1.4rem;
    text-shadow: 0 0 8px #fff;
    letter-spacing: 2px;
    white-space: nowrap;
    display: inline-block;
    animation: heartAnim 10s infinite alternate ease-in-out;
}
@keyframes heartAnim {
    0% { transform: translateY(0) rotate(-15deg);}
    50% { transform: translateY(-10px) rotate(15deg);}
    100% { transform: translateY(0) rotate(-15deg);}
}
@media(max-width: 500px){
    .timer-grid { grid-template-columns: repeat(2,1fr); gap:4px; font-size:0.8rem; }
    .start-btn { font-size:1rem; padding:10px 20px; }
    .bubu-dudu { width: 80px; }
    #counter-box { font-size:0.75rem; }
}
</style>
</head>
<body>

<!-- Overlay -->
<div id="overlay">
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZqZnd4eGZyeGZyeGZyeGZyeGZyeGZyeGZyeGZyeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v8YmYV2vGf89JkRkM7/giphy.gif">
    <button class="start-btn" onclick="startExperience()">Click to unlock a surprise 💜</button>
</div>

<!-- Audio -->
<audio id="music" loop>
    <source src="https://drive.google.com/uc?export=download&id=1skob7k23Yx2JRHKAJm_V5kQpNj9R4Gcn" type="audio/mpeg">
</audio>

<div id="ui">
    <span class="love_word">I LOVE YOU 💜</span>
</div>

<!-- Main Card -->
<div class="container" id="mainCard">
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMXZqN3J3eXh3eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/M90mJ0WfG5S8S0Z9xI/giphy.gif" class="bubu-dudu">
    <h2 style="color: var(--main-purple); margin: 0;">Our Story</h2>

    <div id="counter-box">
        <p style="margin: 0 0 10px 0;">Time since we first talked:</p>
        <div class="timer-grid" id="timer">
            <div><div id="days">0</div><div class="unit">Days</div></div>
            <div><div id="hours">0</div><div class="unit">Hrs</div></div>
            <div><div id="mins">0</div><div class="unit">Mins</div></div>
            <div><div id="secs">0</div><div class="unit">Secs</div></div>
        </div>
    </div>

    <div class="memory-list">
        <div class="memory-point"><span class="m-date">Aug 3, 2025 • 11:17 PM</span><br>When we first talked 💜</div>
        <div class="memory-point"><span class="m-date">Sep 27, 2025 • 2:03 PM</span><br>You said YES 💕</div>
        <div class="memory-point"><span class="m-date">Nov 9, 2025 • 5:04 PM</span><br>Our first kiss 💋
        <div style="margin-top:10px; display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
            <img src="https://i.postimg.cc/r0tJYZL8/IMG-20250810-181927-0288.jpg" style="width:100%; border-radius:10px;">
            <img src="https://i.postimg.cc/8fQH8d1V/IMG-20250824-WA0011-1.jpg" style="width:100%; border-radius:10px;">
            <img src="https://i.postimg.cc/R6nRbpzr/IMG-20250824-WA0017.jpg" style="width:100%; border-radius:10px;">
            <img src="https://i.postimg.cc/8fQH8d1j/IMG-20251027-095621.jpg" style="width:100%; border-radius:10px;">
            <img src="https://i.postimg.cc/y34PqhVZ/IMG-20251102-183658.jpg" style="width:100%; border-radius:10px;">
            <img src="https://i.postimg.cc/wR8VK56R/IMG-20251109-WA0016.jpg" style="width:100%; border-radius:10px;">
        </div>
        </div>
    </div>

    <h3 style="margin-top: 20px;">Catch hearts to see your surprise!</h3>
</div>

<!-- Valentine Question -->
<div id="valentineQuestion" class="hidden container">
    <h2>Will you be my Valentine? 💖</h2>
    <div style="position: relative; height: 60px;">
        <button id="yesBtn" onclick="celebrate()">YES! 💜</button>
        <button id="noBtn" onmouseover="moveNo()">NO 😅</button>
    </div>
</div>

<!-- Final Black-Screen -->
<div id="finalMessage" class="hidden container">
</div>

<script>
const startTime = new Date("August 3, 2025 23:17:00").getTime();
function updateTimer(){
    const now = new Date().getTime();
    const diff = now - startTime;
    document.getElementById("days").innerText = Math.floor(diff/(1000*60*60*24));
    document.getElementById("hours").innerText = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    document.getElementById("mins").innerText = Math.floor((diff%(1000*60*60))/(1000*60));
    document.getElementById("secs").innerText = Math.floor((diff%(1000*60))/1000);
}
setInterval(updateTimer,1000);

function startExperience(){
    document.getElementById('overlay').style.display='none';
    document.getElementById('music').play();
    createHeartsGame();
}

function moveNo(){
    const btn=document.getElementById('noBtn');
    const x=Math.random()*(window.innerWidth-80);
    const y=Math.random()*(window.innerHeight-60);
    btn.style.left=x+'px';
    btn.style.top=y+'px';
}

function celebrate(){
    document.getElementById('valentineQuestion').classList.add('hidden');
    // Black screen effect
    document.body.innerHTML = '';
    document.body.style.background = 'black';
    // Create multiple I LOVE YOU BUBU texts
    for(let i=0;i<100;i++){
        const text=document.createElement('div');
        text.innerText='I LOVE YOU BUBU 💜';
        text.style.position='absolute';
        text.style.color='white';
        text.style.fontSize=(10+Math.random()*20)+'px';
        text.style.left=Math.random()*90+'vw';
        text.style.top=Math.random()*90+'vh';
        text.style.fontWeight='bold';
        document.body.appendChild(text);
    }
    // Crash website simulation
    setTimeout(()=>{alert("Just kidding 😘 Love you Bubu!");},3000);
}

function createHeartsGame(){
    let count=0;
    const gameInterval=setInterval(()=>{
        const heart=document.createElement('div');
        heart.className='heart';
        const colors=['#ff4081','#ea80b0','#9c27b0'];
        heart.style.color=colors[Math.floor(Math.random()*colors.length)];
        heart.style.fontSize=(Math.random()*15+15)+'px';
        heart.style.left=Math.random()*90+'vw';
        heart.innerHTML='❤️';
        document.body.appendChild(heart);
        heart.onclick=function(){
            count++;
            showMemory(count);
            heart.remove();
            if(count>=5){
                clearInterval(gameInterval);
                document.getElementById('mainCard').classList.add('hidden');
                document.getElementById('valentineQuestion').classList.remove('hidden');
            }
        }
        setTimeout(()=>heart.remove(),5000);
    },800);
}

function showMemory(count){
    const messages=[
        "You are my forever 💜",
        "Remember our first kiss 😘",
        "You make me happiest ❤️",
        "Thanks for everything, Bubu 💕",
        "I promise to love you forever 🥰"
    ];
    if(count>messages.length) return;
    const msg=document.createElement('div');
    msg.innerText=messages[count-1];
    msg.style.position='fixed';
    msg.style.left=Math.random()*70+'vw';
    msg.style.top=Math.random()*70+'vh';
    msg.style.background='rgba(255,255,255,0.9)';
    msg.style.padding='8px 12px';
    msg.style.borderRadius='12px';
    msg.style.color='#9c27b0';
    msg.style.fontWeight='bold';
    msg.style.zIndex=200;
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),2500);
}
</script>
</body>
</html>
